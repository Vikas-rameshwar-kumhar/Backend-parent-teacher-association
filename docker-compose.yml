version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: pta_postgres
    restart: always
    environment:
      POSTGRES_USER: pta_user
      POSTGRES_PASSWORD: pta_password
      POSTGRES_DB: pta_db
    ports:
      - '5433:5432'
    volumes:
      - pta_pgdata:/var/lib/postgresql/data

volumes:
  pta_pgdata:

